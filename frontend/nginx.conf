# Drop connection to any unauthorized domain (e.g., cyrus.*) or direct IP access
server {
    listen 80 default_server;
    server_name _;
    return 444; # Nginx non-standard code to abruptly close the TCP connection
}

# Explicitly serve only the authorized domain
server {
    listen 80;
    server_name renewal.shareindiainsurance.com localhost;
    root /usr/share/nginx/html;
    index index.html;
    
    # Allow larger file uploads (e.g., PDF documents)
    client_max_body_size 150M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_header Authorization;
    }
}

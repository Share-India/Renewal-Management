<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.6);
            border-left: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 30px rgba(0, 60, 144, 0.1);
        }
        .input-field:focus-within {
            border-bottom-color: #003c90;
            background: rgba(255, 255, 255, 0.6);
        }
    </style>

<body class="bg-background text-on-background min-h-screen relative overflow-hidden font-body-lg">
<!-- Abstract 3D Security Background Image -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center bg-no-repeat opacity-40 mix-blend-multiply" data-alt="A 3D abstract security illustration featuring a glowing, translucent blue shield with intricate cybernetic lines and nodes. Behind the shield, a glossy, metallic padlock hovers, connected by dynamic geometric patterns. The overall composition is set against a pristine, light-mode background with soft, ambient lighting and subtle volumetric fog, emphasizing high-end corporate security and advanced technology." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDKdQiHZDWpASrMbfHxYETKnSfiGtdTXPdfruowsaIs6lYKA1qe4pqjXFEYRhy509iv2xTDKzv2rHw2jVJ05Zqdoh5qZ9J01U8ETMkAO3tZdtFtAk4GaOIAbwArBFosg1--a2V5hWSvujc_fvE6UtAnhmMqJGchTzkTufsHDYF6XOWC62fnTYb01Ra5I_6dar3fZvvUxwHUqIr8AMkqXh9Uv4JkNeUbzBnaLMNh9rJOSDcN6FjuuGnsWjWDxE7kvxVUx_spziAuGe72')"></div>
<div class="absolute inset-0 bg-gradient-to-b from-surface/30 to-surface/90"></div>
</div>
<!-- Main Content Canvas -->
<div class="relative z-10 min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop w-full max-w-container-max-width mx-auto">
<!-- Login Container -->
<main class="w-full max-w-[480px] flex flex-col gap-8">
<!-- Brand Logo -->
<div class="flex justify-center mb-4">
<img class="h-16 w-auto object-contain rounded-md" data-alt="Share India Insurance company logo, featuring a minimalist, geometric 'I' inside a stylized shield emblem, rendered in a crisp, solid primary blue (#0f52ba). The logo is set on a transparent background, ensuring high legibility and a premium corporate identity." src="https://lh3.googleusercontent.com/aida/AP1WRLsdsy9s2YizQE4OvCO9now_XyZNuB1RLCqFuB7K3oNb1pmTnzob3Obb_9Zg9L372uVmvLruP6gYXGFULjcgb6Tus2yRGOnWlrEfPv1NRo1UQQg70liZJdo0dIjO0EhMxkg4YqHm2oR4aHE3vpipcZzi276Q8TPbTeWuhK_THZcbn6rg_aKJadW_aizqCJ0o1qpG6B0oMQZXota77FOCcNXqYj5cvS4pnnYkDuD6WmK5NS933KZI9rnE5xQP"/>
</div>
<!-- Glassmorphic Form Card -->
<div class="glass-panel rounded-xl p-8 md:p-10 w-full flex flex-col gap-6 relative overflow-hidden">
<!-- Ambient highlight for glass effect -->
<div class="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-white/30 to-transparent pointer-events-none"></div>
<!-- Header -->
<header class="flex flex-col items-center text-center gap-2 relative z-10">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-primary tracking-tight">Welcome Back</h1>
<p class="font-body-md text-on-surface-variant flex items-center gap-2">
<span aria-hidden="true" class="material-symbols-outlined text-sm" data-icon="manage_accounts">manage_accounts</span>
                        Signing in as <strong class="text-primary font-semibold">Renewer</strong>
</p>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-5 relative z-10">
<!-- Username Input -->
<div class="flex flex-col gap-1.5 relative group input-field">
<label class="font-label-xs text-on-surface-variant ml-1" for="username">Username / Email ID</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span aria-hidden="true" class="material-symbols-outlined text-outline-variant group-focus-within:text-primary transition-colors duration-200" data-icon="person">person</span>
</div>
<input class="w-full bg-surface-container-highest/30 border-0 border-b-2 border-outline-variant/30 text-on-surface font-body-md rounded-t-DEFAULT pl-10 pr-4 py-3 focus:ring-0 focus:border-primary transition-all duration-300 placeholder-outline-variant/60" id="username" name="username" placeholder="Enter your credentials" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5 relative group input-field">
<div class="flex justify-between items-center ml-1">
<label class="font-label-xs text-on-surface-variant" for="password">Password</label>
<a class="font-label-xs text-primary hover:text-primary-container transition-colors duration-200 focus:outline-none focus:underline" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span aria-hidden="true" class="material-symbols-outlined text-outline-variant group-focus-within:text-primary transition-colors duration-200" data-icon="lock">lock</span>
</div>
<input class="w-full bg-surface-container-highest/30 border-0 border-b-2 border-outline-variant/30 text-on-surface font-body-md rounded-t-DEFAULT pl-10 pr-10 py-3 focus:ring-0 focus:border-primary transition-all duration-300 placeholder-outline-variant/60" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline-variant hover:text-on-surface-variant focus:outline-none" type="button">
<span aria-hidden="true" class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4 mt-4">
<button class="w-full bg-primary text-on-primary font-title-md py-3.5 px-6 rounded-lg shadow-[0_4px_14px_rgba(0,60,144,0.3)] hover:shadow-[0_6px_20px_rgba(0,60,144,0.4)] hover:bg-primary/90 transition-all duration-300 flex items-center justify-center gap-2 relative overflow-hidden group" type="submit">
<div class="absolute inset-0 w-full h-1/2 bg-gradient-to-b from-white/20 to-transparent pointer-events-none"></div>
<span>Secure Sign In</span>
<span aria-hidden="true" class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform duration-300" data-icon="arrow_forward">arrow_forward</span>
</button>
<a class="w-full flex items-center justify-center gap-2 py-3 px-6 rounded-lg border border-outline-variant/50 bg-white/20 text-on-surface hover:bg-white/40 hover:border-outline-variant transition-all duration-300 font-label-sm backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-primary/50" href="#">
<span aria-hidden="true" class="material-symbols-outlined text-lg" data-icon="arrow_back">arrow_back</span>
                            Return to Role Selection
                        </a>
</div>
</form>
</div>
<!-- Security Note -->
<div class="text-center mt-2 flex items-center justify-center gap-2 opacity-70">
<span aria-hidden="true" class="material-symbols-outlined text-sm text-secondary" data-icon="verified_user">verified_user</span>
<span class="font-label-xs text-on-surface-variant">End-to-end encrypted connection</span>
</div>
</main>
</div>
</body></html>

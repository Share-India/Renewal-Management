<div class="app-container">
  <nav class="premium-navbar" *ngIf="authService.isLoggedIn()">
    <div class="nav-container">
      <a class="nav-brand" href="#">
        <img src="assets/logo.png" alt="Share India">
        <span>Share India</span>
      </a>
      
      <div class="nav-links">
        <ul class="nav-list">
          <!-- Renewals: Visible only to RENEWER role -->
          <li class="nav-item" *ngIf="authService.hasRole('RENEWER')">
            <a class="nav-link" routerLink="/" routerLinkActive="active"
              [routerLinkActiveOptions]="{exact: true}"
              (click)="setSourceTeam('')">Renewals Dashboard</a>
          </li>

          <!-- Servicing: Visible only to SERVICING role -->
          <li class="nav-item" *ngIf="authService.hasRole('SERVICING')">
            <a class="nav-link" routerLink="/servicing" routerLinkActive="active"
              [routerLinkActiveOptions]="{exact: true}">Servicing Dashboard</a>
          </li>

          <!-- Admin Dashboard: Visible only to Admins -->
          <li class="nav-item" *ngIf="authService.isAdmin()">
            <a class="nav-link" routerLink="/admin" routerLinkActive="active"
              [routerLinkActiveOptions]="{exact: true}">Admin</a>
          </li>

          <!-- RM Dashboard: Visible only to RM -->
          <li class="nav-item" *ngIf="authService.hasRole('RM')">
            <a class="nav-link" routerLink="/admin" routerLinkActive="active"
              [routerLinkActiveOptions]="{exact: true}">RM Dashboard</a>
          </li>


          <!-- User Management: Visible only to Admins -->
          <li class="nav-item" *ngIf="authService.isAdmin()">
            <a class="nav-link" routerLink="/admin/users" routerLinkActive="active">Add User</a>
          </li>

          <!-- Manager Dashboards (Admin Assess) -->
          <li class="nav-item" *ngIf="authService.isAdmin()">
            <a class="nav-link" routerLink="/admin/dashboard/claims" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Claim Team</a>
          </li>
          <li class="nav-item" *ngIf="authService.isAdmin()">
            <a class="nav-link" routerLink="/admin/dashboard/sales" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Sales Team</a>
          </li>
          <li class="nav-item" *ngIf="authService.isAdmin()">
            <a class="nav-link" routerLink="/admin/dashboard/underwriting" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">UnderWriting Team</a>
          </li>

          <!-- Policy Servicing: Visible to Admin -->
          <li class="nav-item" *ngIf="authService.isAdmin()">
            <a class="nav-link" routerLink="/servicing" routerLinkActive="active"
              [routerLinkActiveOptions]="{exact: true}">Policy Servicing</a>
          </li>

          <!-- MIS Dashboard: Visible only to MIS or Admin -->
          <li class="nav-item" *ngIf="authService.hasRole('MIS') || authService.isAdmin()">
            <a class="nav-link" routerLink="/mis-dashboard" routerLinkActive="active"
              [routerLinkActiveOptions]="{exact: true}">MIS Dashboard</a>
          </li>
        </ul>
        <div class="nav-actions">
          <ng-container *ngIf="authService.hasRole('RENEWER')">
            <button class="nav-link border-0 mx-1" 
                    style="cursor:pointer; background: transparent; padding: 6px 16px; border-radius: 999px; transition: all 0.2s ease;"
                    [ngClass]="{'active text-primary bg-white fw-bold shadow-sm': selectedSourceTeam === 'CLAIMS'}" 
                    (click)="setSourceTeam('CLAIMS')">
              Claim Update
            </button>
            <button class="nav-link border-0 mx-1" 
                    style="cursor:pointer; background: transparent; padding: 6px 16px; border-radius: 999px; transition: all 0.2s ease;"
                    [ngClass]="{'active text-primary bg-white fw-bold shadow-sm': selectedSourceTeam === 'SALES'}" 
                    (click)="setSourceTeam('SALES')">
              Sales Update
            </button>
            <button class="nav-link border-0 mx-1" 
                    style="cursor:pointer; background: transparent; padding: 6px 16px; border-radius: 999px; transition: all 0.2s ease;"
                    [ngClass]="{'active text-primary bg-white fw-bold shadow-sm': selectedSourceTeam === 'UNDERWRITING'}" 
                    (click)="setSourceTeam('UNDERWRITING')">
              UnderWriting Update
            </button>
          </ng-container>
          <button class="nav-btn nav-btn-outline" (click)="openPasswordModal()">
            <i class="bi bi-key"></i> Pass
          </button>
          <button class="nav-btn nav-btn-outline" (click)="logout()">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-content">
    <router-outlet></router-outlet>
  </div>
</div>

<!-- Change Password Modal -->
<div class="modal-overlay" *ngIf="showPasswordModal" (click)="closePasswordModal()">
  <div class="custom-modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Change Password</h3>
      <button class="btn-close" (click)="closePasswordModal()"></button>
    </div>
    <div class="modal-body">
      <div class="form-group mb-3">
        <label>Current Password</label>
        <input type="password" class="form-control" [(ngModel)]="passwordData.oldPassword"
          placeholder="Enter current password">
      </div>
      <div class="form-group mb-3">
        <label>New Password</label>
        <input type="password" class="form-control" [(ngModel)]="passwordData.newPassword"
          placeholder="Enter new password">
        <small class="text-muted">Min 4 chars</small>
      </div>
      <div class="form-group mb-3">
        <label>Confirm New Password</label>
        <input type="password" class="form-control" [(ngModel)]="passwordData.confirmPassword"
          placeholder="Confirm new password">
      </div>

      <div *ngIf="passwordMessage" class="alert mt-3" [class.alert-success]="passwordSuccess"
        [class.alert-danger]="!passwordSuccess">
        {{ passwordMessage }}
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="closePasswordModal()">Cancel</button>
      <button class="btn btn-primary" (click)="changePassword()"
        [disabled]="!passwordData.oldPassword || !passwordData.newPassword">Update Password</button>
    </div>
  </div>
</div>

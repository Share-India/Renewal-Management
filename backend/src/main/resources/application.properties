spring.application.name=insurance-renewal

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/insurance_renewal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Email Configuration
spring.mail.host=zcsone.rimguru.com
spring.mail.port=587
spring.mail.username=communication.renewal@shareindia.co.in
spring.mail.password=Shareindia@#12345
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Server
server.port=8080

# File Upload Limits
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB